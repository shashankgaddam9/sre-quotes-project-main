# Argo CD watches your GitHub repo and keeps the cluster matching what's in git (GitOps).
# Replace YOUR_GITHUB_USER below, then: kubectl apply -f argocd/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quotes-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/sre-quotes-project.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: quotes-staging
  syncPolicy:
    automated:
      prune: true       # delete resources removed from git
      selfHeal: true    # undo manual kubectl changes (try it!)
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quotes-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/sre-quotes-project.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: quotes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

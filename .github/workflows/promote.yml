# CD: promote whatever is running in staging to production.
# Run it manually: GitHub -> Actions -> "Promote to production" -> Run workflow.
# Add required reviewers on the "production" environment (Settings -> Environments)
# to get a manual approval gate — that is your change-management control.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are we deploying? (goes in the commit message)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read staging image
        id: img
        run: |
          # yq is preinstalled on GitHub's ubuntu runners
          IMG=$(yq '.images[] | select(.name == "quotes-api") | .newName' k8s/overlays/staging/kustomization.yaml)
          TAG=$(yq '.images[] | select(.name == "quotes-api") | .newTag' k8s/overlays/staging/kustomization.yaml)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting $IMG:$TAG"
      - name: Point production at the same image
        run: |
          cd k8s/overlays/production
          kustomize edit set image quotes-api=${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "deploy(production): ${{ steps.img.outputs.tag }} - ${{ github.event.inputs.reason }}"
          git push
